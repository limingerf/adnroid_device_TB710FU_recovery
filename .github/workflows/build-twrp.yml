name: Build TWRP recovery

on:
  workflow_dispatch:

jobs:
  build-ramoops-overlay:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Install device tree compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

      - name: Build ramoops overlay
        run: dtc -@ -I dts -O dtb -o ramoops-overlay.dtbo ramoops-overlay.dts

      - name: Upload ramoops overlay
        uses: actions/upload-artifact@v4
        with:
          name: tb710fu-ramoops-overlay
          path: |
            ramoops-overlay.dts
            ramoops-overlay.dtbo

  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache device-tree-compiler flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3
          sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod 0755 /usr/local/bin/repo

      - name: Sync TWRP source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"
          repo init --depth=1 -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git -b twrp-16.0
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags
          mkdir -p device/lenovo/topaz
          rsync -a --delete --exclude .git --exclude twrp/ "$GITHUB_WORKSPACE/" device/lenovo/topaz/

      - name: Build recovery image
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          source build/envsetup.sh
          lunch twrp_topaz
          mka -j2 recoveryimage

      - name: Collect recovery and pstore overlay sources
        uses: actions/upload-artifact@v4
        with:
          name: twrp-topaz-recovery
          path: |
            twrp/out/target/product/topaz/recovery.img
            twrp/device/lenovo/topaz/BoardConfig.mk
            twrp/device/lenovo/topaz/recovery/root/system/bin/pstore_diag
